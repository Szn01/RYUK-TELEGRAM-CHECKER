version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ryuk-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - ADMIN_SECRET=${ADMIN_SECRET:-admin123}
      - DEFAULT_CONCURRENCY=${DEFAULT_CONCURRENCY:-500}
      - MAX_CONCURRENCY=${MAX_CONCURRENCY:-500}
      - REQUEST_TIMEOUT_MS=${REQUEST_TIMEOUT_MS:-8000}
    volumes:
      - ryuk_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/}
    container_name: ryuk-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  ryuk_data:
    name: ryuk_data
